name: Fork tests

# Pull requests from forks are tested here on a GitHub-hosted runner. Our own changes are tested
# on the maintainer machine and reported with scripts/testing/post-status.ts instead. The label
# `test-on-github` runs this for our own pull request when the maintainer machine is unavailable.
# This workflow only tests; "Fork tests status" reports the result as the `tests` commit status.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  quick:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'test-on-github') &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       contains(github.event.pull_request.labels.*.name, 'test-on-github'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # On the job, so an unrelated label's skipped run does not cancel a running test.
    concurrency:
      group: fork-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies and the browser
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Type, pure Node and smoke browser tests
        run: pnpm test:quick
