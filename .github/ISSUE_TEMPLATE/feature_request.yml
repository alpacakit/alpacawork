name: Feature request
description: Something you'd like alpacawork to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This project is maintained on a best-effort basis. Issues may not get a response or a fix.
  - type: textarea
    id: wish
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The problem it would solve for you.
