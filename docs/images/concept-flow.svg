<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 424" width="410" height="424" role="img" aria-labelledby="t d">
<!-- The concept page's drawing for every language but Japanese: concept-flow-ja.svg with English words. The colours follow the viewer's light or dark setting. -->
<title id="t">How one request moves through alpacawork</title>
<desc id="d">1 You tell the AI that is your point of contact (the coordinator) what you want done. 2 The coordinator makes it a task and passes it to the AI that owns it (the owner). 3 The owner splits the work into subtasks, hands each to its own owner, and asks members for help. 4 Questions and reports reach you under Awaiting review.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;text-anchor:middle}
.box{fill:#f6f8fa;stroke:#d0d7de}.name{font-size:15px;font-weight:600;fill:#1f2328}.desc{font-size:13px;fill:#59636e}
.chip{fill:#fff}.label{font-size:13px;fill:#1f2328}.start{text-anchor:start}
.line{fill:none;stroke:#6e7781;stroke-width:1.5}.back{stroke-dasharray:4 4}.head{fill:#6e7781}
.you,.badge{fill:#0969da}.youname{font-size:15px;font-weight:600;fill:#fff}.num{font-size:11px;font-weight:700;fill:#fff}
@media (prefers-color-scheme:dark){
.box{fill:#161b22;stroke:#3d444d}.name{fill:#f0f6fc}.desc{fill:#9198a1}
.chip{fill:#0d1117}.label{fill:#f0f6fc}
.line{stroke:#8b949e}.head{fill:#8b949e}.you,.badge{fill:#1f6feb}}
</style>
<path class="line" d="M205,50 V105"/>
<path class="head" d="M200,102 L205,110 L210,102 Z"/>
<path class="line" d="M205,168 V223"/>
<path class="head" d="M200,220 L205,228 L210,220 Z"/>
<path class="line" d="M205,286 V306 M105,306 H305"/>
<path class="line" d="M105,306 V349"/>
<path class="head" d="M100,346 L105,354 L110,346 Z"/>
<path class="line" d="M305,306 V349"/>
<path class="head" d="M300,346 L305,354 L310,346 Z"/>
<path class="line back" d="M327,257 H368 V31 H269"/>
<path class="head" d="M271,26 L263,31 L271,36 Z"/>
<rect class="you" x="147" y="12" width="116" height="38" rx="19"/>
<text class="youname" x="205" y="36">You</text>
<rect class="box" x="83" y="110" width="244" height="58" rx="8"/>
<text class="name" x="205" y="135">Coordinator</text>
<text class="desc" x="205" y="154">your point-of-contact AI</text>
<rect class="box" x="83" y="228" width="244" height="58" rx="8"/>
<text class="name" x="205" y="253">Owner</text>
<text class="desc" x="205" y="272">the AI that owns a task</text>
<rect class="box" x="10" y="354" width="190" height="58" rx="8"/>
<text class="name" x="105" y="379">Owner of a subtask</text>
<text class="desc" x="105" y="398">owns a piece of the work</text>
<rect class="box" x="210" y="354" width="190" height="58" rx="8"/>
<text class="name" x="305" y="379">Member</text>
<text class="desc" x="305" y="398">an AI that helps</text>
<rect class="chip" x="111" y="67" width="188" height="24" rx="4"/>
<circle class="badge" cx="126" cy="79" r="9"/>
<text class="num" x="126" y="83">1</text>
<text class="label start" x="141" y="83.5">say what you want done</text>
<rect class="chip" x="87" y="185" width="236" height="24" rx="4"/>
<circle class="badge" cx="102" cy="197" r="9"/>
<text class="num" x="102" y="201">2</text>
<text class="label start" x="117" y="201.5">make a task, pass it to an owner</text>
<rect class="chip" x="117" y="317" width="176" height="24" rx="4"/>
<circle class="badge" cx="132" cy="329" r="9"/>
<text class="num" x="132" y="333">3</text>
<text class="label start" x="147" y="333.5">split, and ask for help</text>
<rect class="chip" x="329" y="104.5" width="78" height="79" rx="4"/>
<circle class="badge" cx="368" cy="117.5" r="9"/>
<text class="num" x="368" y="121.5">4</text>
<text class="label" x="368" y="143.5">questions</text>
<text class="label" x="368" y="160.5">and reports</text>
<text class="label" x="368" y="177.5">arrive</text>
</svg>
