<rect class="box" x="83" y="110" width="244" height="58" rx="8"/>
<text class="name" x="205" y="135">コーディネーター</text>
<text class="desc" x="205" y="154">あなたの窓口の AI</text>
<rect class="box" x="83" y="228" width="244" height="58" rx="8"/>
<text class="name" x="205" y="253">責任者</text>
<text class="desc" x="205" y="272">タスクを受け持つ AI</text>
<rect class="box" x="10" y="354" width="190" height="58" rx="8"/>
<text class="name" x="105" y="379">子タスクの責任者</text>
<text class="desc" x="105" y="398">分けた仕事を受け持つ AI</text>
<rect class="box" x="210" y="354" width="190" height="58" rx="8"/>
<text class="name" x="305" y="379">作業者</text>
<text class="desc" x="305" y="398">手伝いの AI</text>
<rect class="chip" x="122" y="67" width="166" height="24" rx="4"/>
<circle class="badge" cx="137" cy="79" r="9"/>
<text class="num" x="137" y="83">1</text>
<text class="label start" x="152" y="83.5">やりたいことを伝える</text>
<rect class="chip" x="102.5" y="185" width="205" height="24" rx="4"/>
<circle class="badge" cx="117.5" cy="197" r="9"/>
<text class="num" x="117.5" y="201">2</text>
<text class="label start" x="132.5" y="201.5">タスクにして、責任者につなぐ</text>
<rect class="chip" x="117" y="317" width="176" height="24" rx="4"/>
<circle class="badge" cx="132" cy="329" r="9"/>
<text class="num" x="132" y="333">3</text>
<text class="label start" x="147" y="333.5">分けて、手伝いを頼む</text>
